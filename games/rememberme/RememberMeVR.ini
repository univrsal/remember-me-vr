; Remember Me VR mod configuration. Lives next to dinput8.dll in Binaries/Win32.

[Core]
; 0 = load as a plain dinput8 proxy: no hooks, no log.
Enabled=1

[Log]
; trace | debug | info | warn | error | off. Log file: RememberMeVR.log next to this file.
Level=debug

[VR]
; 0 = no OpenXR (hooks and log only). SteamVR must be running before the game starts.
Enabled=1
; stereo: the game rendered per eye (needs the engine hooks), shown on a flat
; panel whenever no stereo frame is available (loading screens, videos).
; screen: always the flat panel.
Mode=stereo
; Where stereo images come from: scene (the game's internal scene image, so
; resolution = window size x SuperSampleCount; recommended) or backbuffer
; (window resolution).
StereoSource=scene
; Unreal units per metre of head movement (world scale). Larger = you feel smaller.
WorldScale=50
; Game camera orientation the head pose is applied to: yaw (horizon kept
; level; game camera pitch/roll ignored) or full.
CameraOrientation=yaw
; Render each eye with a symmetric frustum enclosing the headset's asymmetric
; one (about 10% more pixels). Diagnostic/workaround for effects that assume
; a centred projection.
SymmetricProjection=0
; Stereo frames: draw the game's UI (menus, HUD, subtitles) onto its own
; floating panel. Distance, width and vertical offset in metres.
UiPanel=1
UiDistance=1.6
UiWidth=1.3
UiHeight=0.0
; Monitor mirror (the game window) while VR runs in stereo: left (the left eye
; with its UI, centred) or stereo (both eyes side by side). MirrorUi draws the
; UI into the window too (it's on its own panel in VR).
MirrorView=left
MirrorUi=1
; Loading screens: show them on the flat panel (as on a monitor, the tips
; panel covering the level) instead of the half-streamed level in stereo.
FlatLoadingScreens=1
; Menus (pause/Sensen menu, Combo Lab): show them on the flat panel too; their
; 3D backdrop is made for the game's field of view.
FlatMenus=1
; Turn off the game's motion blur (uncomfortable in VR); overrides the game's
; [SystemSettings] MotionBlur while the mod runs.
DisableMotionBlur=1
; Flat panel (loading screens, videos) size and distance in metres.
ScreenWidth=3.0
ScreenDistance=2.5
; Virtual-key code to recenter the view (0x77 = F8, 0 = disabled).
RecenterKey=0x77

[UE3]
; Find UE3's name/object tables at startup (logged to RememberMeVR.log).
Discover=1
; Write RememberMeVR_objects.txt (every UObject) and RememberMeVR_types.txt (classes,
; structs, properties with offsets) at startup.
DumpObjectsOnStart=1
; Virtual-key code to write a fresh object dump in game (0x78 = F9, 0 = disabled).
DumpObjectsKey=0x78

[Stereo]
; Hook the engine's per-player view setup (needed for stereo). Known build only.
EngineHooks=1
; Development test: render the scene as two side-by-side views (left/right
; halves) with the camera shifted per eye. F10 toggles it in game.
TestSideBySide=0
ToggleKey=0x79
; Distance between the two test cameras in Unreal units.
EyeSeparation=6.4
; Projection in the flat test: game (the game's own) or the left eye's FOV in
; degrees "left,right,up,down" (right eye mirrored), e.g. headset-like values
; from the log's "eye FOV" line, so the flat test renders like VR (for
; RenderDoc captures, which don't work in VR).
TestFov=game
; View state (temporal/occlusion history) for the right eye in the test:
; own (allocated like the engine's, default), shared (left eye's), or none
; (null; crashes in DONTNOD's motion blur).
RightEyeViewState=own
; Fix DONTNOD's DNEResolution shader constant for views that don't start at
; the render target's origin (the right eye): without it, depth-faded effects
; (fog/light volumes) show horizontal bands in the right eye. docs/09.
FixDNEResolution=1
; Fix screen-space copies (client-memory quads) that sample a view's region of
; the scene buffer as if the view covered the whole buffer (e.g. the depth copy soft particles and fog
; read: without it smoke and fog get cut off by masks in the right eye). docs/09.
FixQuadTextureSize=1
; Draw the Sensen AR hints (in-world prompts) in both eyes. The game draws them
; for the first view only; they're redrawn with the right eye's projection.
SensenStereo=1
; Log the first N CalcSceneView calls, then every Nth.
LogFirstCalls=8
LogEvery=600

[Debug]
; Log every Nth present at debug level (0 = never).
PresentLogInterval=0
; Right-eye banding diagnostic (docs/09, artifact A): log the per-view inputs,
; pixel-shader constants and sampler states of the half-res depth downsample
; for the next N stereo frames (0 = off). F10 (side-by-side toggle) re-arms it.
DepthDownsampleLog=0
